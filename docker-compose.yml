version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3005:3005"
    environment:
      - NEXT_PUBLIC_API_URL=http://164.68.126.30:4005
      - BACKEND_INTERNAL_URL=http://backend:4005
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - NODE_ENV=production
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data: